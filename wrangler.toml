name = "other-privacy-policies"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Custom domain (DNS + SSL managed by Cloudflare)
routes = [
  { pattern = "policies.vikaranet.com", custom_domain = true }
]

# Import .html and .txt files as plain text strings
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true
